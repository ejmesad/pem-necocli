paginas_live:
  - GET /                  → home (hero + huellas + KPIs)
  - GET /colegios          → 19 IER en grid con filtros
  - GET /colegios/{slug}   → ficha individual con sedes y proyectos
  - GET /nuestras-huellas  → listado de huellas
  - GET /quienes-somos     → página PEM 2025-2035 (estático)
  - GET /dashboard-pem     → dashboard seguimiento (estático Chart.js)

instrumentos_standalone:
  ficha_diagnostico_institucional:
    archivo: Ficha_Diagnostico_PEM_Necocli.html
    descripcion: >
      Instrumento de diagnóstico institucional (espejo del baremo Excel PEM)
      para las 19 IE de Necoclí. Sin login. Persistencia en localStorage por
      institución. Tabs: Ficha · Diagnóstico · Institucionalización ·
      Hallazgos · Escalafón.
    estado: actualizado_2026-06-25
    hosting_sugerido: dynamizesas.com o pemnecocli.com (archivo estático)
    funcionalidades:
      - Llenado sin registro, autoguardado en localStorage por IE
      - Exportar ficha (.json) / importar ficha (.json)
      - Exportar fila (.csv) y escalafón comparativo (.csv)
      - Imprimir / Guardar PDF (window.print con estilos @media print)
      - "NUEVO: módulo Compromiso firmado (pestaña Hallazgos)"
    compromiso_firmado:
      tipo: identidad_declarada_sin_clave
      campos: [nombre_completo, cargo (Rector/Coordinador/Coord. académico/Evaluador PEM/Otro), institucion]
      archivo_adjunto: PDF o imagen (jpg/png), máx 8MB, codificado base64 dentro del JSON exportado
      almacenamiento_actual: 100% client-side (localStorage + export JSON) — sin backend
      trazabilidad: nombre + cargo + IE + archivo + timestamp, mostrados en pantalla y embebidos en el JSON
      limitacion_conocida: >
        No verifica que la persona sea realmente quien dice ser (no hay clave
        ni cuenta). Es trazabilidad documental, no de seguridad informática.
        Mitigación actual: la Mesa reconoce manualmente al rector/coordinador
        real de cada IE al recibir el archivo.
      evolucion_futura: >
        Cuando OI-M1F6 (Google Sign-In) esté implementado, este módulo puede
        migrar a Opción B (clave institucional) o a cuentas reales por rol.

